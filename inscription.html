<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
content="width=device-width,initial-scale=1.0">
    <meta name="description"
content="Inscrivez-vous au conférence Atlas-Dev-Days le 11 et 12 octobre 2026 et profiter-vous du multiple intérventions présenter par 
plusieurs intérvenants.">
    <title>ATLAS-DEV-DAYS inscription</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body id="body1">
    <header>
        <img id="logo" src="/assets/icons/AtlasLogo-transparent.webp" alt="logo">
        <a href="www.atlas-dev.com"><button id="pbtn">Learn More</button></a>
        <div id="tag1">
        <a href="Accueil.html">Acceuil</a>
        <a href="programme.html">programme</a>
        <a href="intervenants.html">intervenants</a>
        <a href="inscription.html">inscription</a>
        </div>
    </header>
    <main id="main4">
        <h1 id="titre">FORMULAIRE D'INSCRIPTION</h1>
        <form>
            <label for="name" id="nom1">Nom Complet:</label><br>
            <input type="text" id="name" minlength="3" required><br><br>

            <label for="email" id="email1">Email:</label><br>
            <input type="email" id="email" required><br><br>

            <label for="tel" id="tel1">Telephone:</label><br>
            <input type="tel" id="tel" name="tel" pattern="^(\+212|0)[5-7][0-9]{8}$" required><br><br>

            <label id="profil1">Profile:</label><br><br>
            <div class="profile">

                <div>
                    <input type="radio" name="Profile" id="etudiant" value="etudiant" required>&emsp;
                    <label for="etudiant">Étudiant·e</label>
                </div>
                <div>
                    <input type="radio" name="Profile" id="Developpeur" value="developeur">&emsp;
                    <label for="Developpeur">Développeur·se</label>
                </div>
    
                <div>
                    <input type="radio" name="Profile" value="autre">&emsp;
                    <label for="autre" >Autre</label>
                </div>
            </div><br>

            <label id="ateliers">Ateliers Souhaitées:</label><br><br>
            <div class="atelier">

                <div>
                    <input type="checkbox" name="atelier" value="Git/Github" >&emsp;
                    <label for="Git/Github">Git/Github</label>
                </div>
                <div>
                    <input type="checkbox" name="atelier" value="HTML/CSS">&emsp;
                    <label for="HTML/CSS">HTML/CSS</label>
                </div>
    
                <div>
                    <input type="checkbox" name="atelier" value="Java/JavaScript">&emsp;
                    <label for="Java/JavaScript" >Java/JavaScript</label>
                </div>
            </div><br><br>
            <label id="jour">Journée(s) de participation</label><br><br>
            <div class="jours">
                <div>
                    <input type="radio" name="jour" value="Jour1" required>&emsp;
                    <label for="jour1">journée 1</label>
                </div>
                <div>
                    <input type="radio" name="jour" value="Jour2">&emsp;
                    <label for="jour2">journée 2</label>
                </div>
                <div>
                    <input type="radio" name="jour" value="les deux">&emsp;
                    <label for="les deux">Les Deux Jours</label>
                </div>
            </div><br><br>

            <label id="msg">Message:</label><br>
            <input type="text" id="msg1"><br><br>

            <div  id="cons1">
                <input type="checkbox" required> &emsp;
                <label>Consentement</label><br><br>
            </div><br><br>

            <input id="sbmt" type="submit" value="Submit">

        </form>
    </main>
     <footer>
        <div id="tag2">
            <p>Contact: +212 5 33 11 35 75</p>
            <a href="https::/Instagram.com/in/Atlasdev">INSTAGRAM</a><br>
            <a href="https::/linkedin.com/in/Atlasdev">LINKEDIN</a>
        </div>
    <P>All Rights Reserved</P>
    <p id="mention">Atlas-Dev-Company</p>
    </footer>
</body>
</html>
